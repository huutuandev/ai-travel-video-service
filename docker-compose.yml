name: ai-travel-video-service

x-app: &app
  build:
    context: .
    target: runtime
  env_file: ${SERVICE_ENV_FILE:-.env}
  environment:
    MEDIA_ROOT: /data/media
  volumes:
    - media-data:/data/media
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  video-api:
    <<: *app
    environment:
      MEDIA_ROOT: /data/media
      WAN_API_KEY: ""
      WAVESPEED_API_KEY: ""
      GROQ_API_KEY: ""
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=5).close()"]
      interval: 5s
      timeout: 6s
      retries: 20

  video-worker:
    <<: *app
    build:
      context: .
      target: ${VIDEO_WORKER_TARGET:-runtime}
    volumes:
      - media-data:/data/media
      - ${TTS_MODEL_HOST_DIR:-./models/tts}:/data/models/tts:ro
    cpus: ${VIDEO_WORKER_CPUS:-4}
    mem_limit: ${VIDEO_WORKER_MEMORY:-4g}
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    command: ["celery", "-A", "app.workers.celery_app:celery", "worker", "--beat", "--schedule=/tmp/video-celerybeat", "--loglevel=INFO"]
    depends_on:
      video-api:
        condition: service_healthy

  video-tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://video_test:video_test@postgres-test:5432/video_test
    depends_on:
      postgres-test:
        condition: service_healthy

  postgres-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: video_test
      POSTGRES_USER: video_test
      POSTGRES_PASSWORD: video_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_test -d video_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  media-data:

